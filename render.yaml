# RapidGrid web service. The built React app and the FastAPI API share one
# host, so the browser's /api and /ws calls match the Vite dev proxy.
services:
  - type: web
    name: rapidgrid
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    # Persistent disks require a paid instance. This manifest is reviewed before
    # applying; changing it does not provision a disk by itself.
    plan: starter
    region: singapore
    healthCheckPath: /health/live
    numInstances: 1
    disk:
      name: rapidgrid-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: RAPIDGRID_MODE
        value: operator
      # The contacts JSON (unit and hospital numbers, dispatch, 112, staff PINs).
      # Render asks for its value on first deploy; never commit it.
      - key: RAPIDGRID_CONTACTS
        sync: false
      - key: RAPIDGRID_DATA_DIR
        value: /var/data
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GOOGLE_MAPS_JS_API_KEY
        sync: false
