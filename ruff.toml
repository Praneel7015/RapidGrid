# Ruff config for the FastAPI backend and the skill helper scripts.
target-version = "py311"
line-length = 100
extend-exclude = ["frontend", "temp", "backend/venv"]

[lint]
# Pyflakes, core pycodestyle errors, import sorting and pyupgrade.
# Widen this (B, SIM, BLE, ...) once the codebase is clean on these.
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = [
    "UP042", # str+Enum -> StrEnum changes str() output used in API payloads
]

[lint.per-file-ignores]
# Tests and scripts put backend/ on sys.path before importing app modules.
"backend/tests/**" = ["E402"]
"backend/scripts/**" = ["E402"]

[lint.isort]
known-first-party = ["agents", "bus", "models", "routers", "main"]
