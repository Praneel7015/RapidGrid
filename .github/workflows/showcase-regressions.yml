name: RapidGrid checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
        env:
          RAPIDGRID_TEST_DATA_DIR: ${{ runner.temp }}/rapidgrid-unit-data
          GOOGLE_ROUTES_API_KEY: ''
          OPENWEATHER_API_KEY: ''

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            tests/browser/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        env:
          # Skip onnxruntime-node's GPU binary download (unused; now 404s).
          npm_config_onnxruntime_node_install_cuda: skip
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/browser -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t rapidgrid:ci .
      - name: Serves the app and the API
        run: |
          docker run -d --name rg -p 127.0.0.1:8080:10000 rapidgrid:ci
          for i in $(seq 60); do curl -fsS 127.0.0.1:8080/health/live && break; sleep 2; done
          curl -fsS 127.0.0.1:8080/health/live
          curl -fsS 127.0.0.1:8080/demo | grep -q 'id="root"'
          curl -fsS -o /dev/null 127.0.0.1:8080/api/hospital/list
          docker rm -f rg
      - name: Operator mode with no PINs warns in the logs
        run: |
          docker run -d --name rg-op -e RAPIDGRID_MODE=operator rapidgrid:ci
          for i in $(seq 30); do docker logs rg-op 2>&1 | grep -q 'OPEN DEPLOYMENT' && break; sleep 1; done
          docker logs rg-op 2>&1 | grep 'OPEN DEPLOYMENT'
          test "$(docker inspect -f '{{.State.Running}}' rg-op)" = true
          docker rm -f rg-op
